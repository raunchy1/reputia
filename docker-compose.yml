# Coolify / production compose. No host ports are published: Coolify's proxy
# routes the public domain to `web:3000`, and Postgres stays on the internal network.
x-database-url: &database-url postgresql://${POSTGRES_USER:-reputia}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reputia}?schema=public

services:
  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_URL: ${APP_URL:?Set APP_URL}
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reputia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-reputia}
    volumes:
      - reputia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reputia} -d ${POSTGRES_DB:-reputia}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  reputia_postgres:
