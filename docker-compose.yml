# Coolify / production compose. No host ports are published: Coolify's proxy
# routes the public domain to `web:3000`, and Postgres stays on the internal network.
x-database-url: &database-url postgresql://${POSTGRES_USER:-reputia}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-reputia}?schema=public

services:
  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: *database-url
      APP_URL: ${APP_URL:?Set APP_URL}
      NODE_ENV: production
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY}
      CRON_SECRET: ${CRON_SECRET:-}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      LEADS_NOTIFY_EMAIL: ${LEADS_NOTIFY_EMAIL:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_MODEL: ${AI_MODEL:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AI_PRICE_INPUT_USD_MTOK: ${AI_PRICE_INPUT_USD_MTOK:-}
      AI_PRICE_OUTPUT_USD_MTOK: ${AI_PRICE_OUTPUT_USD_MTOK:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_AUTOMATIC_TAX: ${STRIPE_AUTOMATIC_TAX:-false}
      STRIPE_ALLOW_LIVE: ${STRIPE_ALLOW_LIVE:-false}
      BILLING_ALERT_EMAIL: ${BILLING_ALERT_EMAIL:-}
      NEXT_PUBLIC_PLAN_PRICE_EUR: ${NEXT_PUBLIC_PLAN_PRICE_EUR:-19}
      NEXT_PUBLIC_TRIAL_DAYS: ${NEXT_PUBLIC_TRIAL_DAYS:-14}
      DEMO_BOOKING_URL: ${DEMO_BOOKING_URL:-}
      LEGAL_COMPANY_NAME: ${LEGAL_COMPANY_NAME:-}
      LEGAL_VAT_NUMBER: ${LEGAL_VAT_NUMBER:-}
      LEGAL_ADDRESS: ${LEGAL_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_PEC: ${LEGAL_PEC:-}
      PRODUCT_OF_NAME: ${PRODUCT_OF_NAME:-}
      PRODUCT_OF_URL: ${PRODUCT_OF_URL:-}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 3

  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: *database-url
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reputia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-reputia}
    volumes:
      - reputia_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reputia} -d ${POSTGRES_DB:-reputia}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Daily pg_dump kept for 14 days in its own volume. Copy it off the server too (see DEPLOY-COOLIFY.md).
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-reputia}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-reputia}
    volumes:
      - reputia_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/reputia-$$(date +%Y%m%d-%H%M).sql.gz
          if pg_dump --no-owner | gzip > "$$f.tmp"; then mv "$$f.tmp" "$$f"; echo "backup ok $$f"; else rm -f "$$f.tmp"; echo "backup FAILED"; fi
          find /backups -name 'reputia-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done

volumes:
  reputia_postgres:
  reputia_backups:
